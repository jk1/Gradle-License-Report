---
name: Publish
run-name: "🚀 Publish ${{ inputs.tag_name }} (via ${{ github.ref_name }})"

on:
  workflow_call:
    inputs:
      tag_name:
        description: "branch, tag or SHA to publish"
        type: string
        default: ""
      validate_only:
        description: "Validation only (do not publish)"
        type: boolean
        default: true
    secrets:
      publish_key:
        description: Gradle Publish Plugin Key
        required: true
      publish_secret:
        description: Gradle Publish Plugin Secret
        required: true
      signing_key_id:
        description: Gradle Signing Key ID
        required: false
      signing_password:
        description: Gradle Signing Password
        required: false
      signing_key:
        description: Gradle Signing Key
        required: false

env:
  CI: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 17
          distribution: temurin
          check-latest: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Publish Plugin to Gradle Portal
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.publish_key }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.publish_secret }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.signing_key_id }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.signing_password }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.signing_key }}

        run: ./gradlew publishPlugins ${{ inputs.validate_only && '--validate-only' || '' }}
